<!doctype html>
<!-- Plantilla de la imagen Open Graph PROVISIONAL (1200×630). Se renderiza con: npm run og -->
<html lang="es"><head><meta charset="utf-8">
<style>
  @font-face{font-family:Archivo;font-weight:600;src:url(../public/fonts/archivo-latin-600-normal.woff2)}
  @font-face{font-family:Archivo;font-weight:800;font-style:italic;src:url(../public/fonts/archivo-latin-800-italic.woff2)}
  @font-face{font-family:'Source Sans 3';font-weight:400;src:url(../public/fonts/source-sans-3-latin-400-normal.woff2)}
</style>
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;font-family:'Source Sans 3',sans-serif;color:#fff;
    background:radial-gradient(120% 90% at 15% 0%,rgba(255,255,255,.14),transparent 60%),linear-gradient(140deg,#1F4E9E,#163872 55%,#16264D);
    display:flex;flex-direction:column;justify-content:center;padding:0 90px;position:relative}
  .sup{font-family:Archivo;font-weight:600;font-size:34px;letter-spacing:.12em;opacity:.9}
  .nom{font-family:Archivo;font-weight:800;font-style:italic;font-size:150px;line-height:1;margin-top:6px}
  .sub{font-size:38px;margin-top:28px;opacity:.92}
  .sello{display:inline-flex;gap:14px;align-items:center;margin-top:34px;background:#fff;color:#16264D;border-radius:999px;padding:14px 28px;font-family:Archivo;font-weight:600;font-size:30px;width:max-content}
  .sello b{color:#C9A000;letter-spacing:2px}
  .tag{position:absolute;top:40px;right:48px;border:2px dashed rgba(255,255,255,.6);border-radius:8px;padding:8px 16px;font-size:22px;font-weight:600;opacity:.85}
  .franja{position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(#C62832 0 50%,#F2C40F 50%)}
</style></head><body>
  <div class="tag">[IMAGEN PROVISIONAL · DEMO]</div>
  <div class="sup">TALLERES MECÁNICOS</div>
  <div class="nom">MARTELO</div>
  <div class="sub">Taller mecánico en Rúa San Rosendo, A Coruña</div>
  <div class="sello"><b>★★★★★</b> 4,8 en Google · 164 reseñas</div>
  <div class="franja"></div>
</body></html>
